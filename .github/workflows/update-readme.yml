name: Update README

on:
  schedule:
    - cron: '0 12 * * *' # daily: blog posts
  workflow_dispatch:

concurrency:
  group: readme-automation
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Update blog posts
        uses: gautamkrishnar/blog-post-workflow@1.9.7
        with:
          feed_list: "https://medium.com/feed/@mohammedfirdousaraoye"
          readme_path: README.md
          gh_token: ${{ secrets.GITHUB_TOKEN }}
